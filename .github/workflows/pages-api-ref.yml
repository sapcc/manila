name: Publish API reference

on:
  pull_request:
    paths:
      - api-ref/**
      - doc/requirements.txt
      - requirements.txt
      - tox.ini
      - tools/validate-json-files.py
      - .github/workflows/pages-api-ref.yml
  push:
    branches:
      - stable/2025.1-m3
    paths:
      - api-ref/**
      - doc/requirements.txt
      - requirements.txt
      - tox.ini
      - tools/validate-json-files.py
      - .github/workflows/pages-api-ref.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            test-requirements.txt
            doc/requirements.txt

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Build API reference
        run: tox -e api-ref

      - name: Upload API reference preview
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: manila-api-ref-preview
          path: api-ref/build/html
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: api-ref/build/html

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
